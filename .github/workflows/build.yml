name: Build Discord PS5 (Homebrew)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Use Docker image with PS5SDK pre-installed for reliable cross-compilation
  DOCKER_IMAGE: ghcr.io/ps5dev/ps5sdk:latest

jobs:
  build:
    name: Build for PS5 (x86_64-unknown-freebsd) with PS5SDK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Use Docker container with PS5SDK pre-installed
    container:
      image: ${{ env.DOCKER_IMAGE }}
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain in container
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd

      - name: Verify PS5SDK in container
        run: |
          echo "=== PS5SDK Environment ==="
          echo "PATH: $PATH"
          echo "PS5SDK_DIR: $PS5SDK_DIR"
          which ps5-clang || which clang
          ps5-clang --version || clang --version
          ps5-clang --target=x86_64-unknown-freebsd -v 2>&1 | head -30 || true
          ls -la $PS5SDK_DIR/

      - name: Install Python dependencies for packaging
        run: |
          pip3 install pillow

      - name: Configure cargo for PS5 target
        run: |
          mkdir -p ~/.cargo

          # PS5SDK provides ps5-clang and ps5-ar which are configured for x86_64-unknown-freebsd
          cat > ~/.cargo/config.toml << EOF
          [target.x86_64-unknown-freebsd]
          linker = "ps5-clang"
          ar = "ps5-ar"

          [env]
          PS5_SDK_PATH = "$PS5SDK_DIR"
          # Use shell \$PATH to preserve system paths (cargo, rustc, etc.)
          PATH = "$PS5SDK_DIR/bin:\${PATH}"
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER = "ps5-clang"
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_AR = "ps5-ar"
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_RUNNER = "ps5-run"
          EOF

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ps5-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ps5-

      - name: Build workspace (check only)
        run: cargo check --workspace --target x86_64-unknown-freebsd --no-default-features --features ps5-platform/ps5,discord-ui/ps5

      - name: Build release binary
        run: cargo build --release --workspace --target x86_64-unknown-freebsd --no-default-features --features ps5-platform/ps5,discord-ui/ps5 --bin discord-app

      - name: Verify binary
        run: |
          file target/x86_64-unknown-freebsd/release/discord-app
          ls -lh target/x86_64-unknown-freebsd/release/discord-app

          # Check if it's a valid FreeBSD/PS5 binary
          if command -v readelf >/dev/null; then
            readelf -h target/x86_64-unknown-freebsd/release/discord-app | head -20
          fi

      - name: Build PS5 Package (.pkg)
        run: |
          python3 packaging/build_pkg.py \
            target/x86_64-unknown-freebsd/release/discord-app \
            -o discord-ps5.pkg \
            --title-id DISCORDPS5 \
            --title "Discord PS5" \
            --version ${{ github.ref_name == 'refs/heads/main' && '0.1.0-dev' || github.ref_name }} \
            --app-ver 01.00 \
            --content-id DISCORDPS5_001 \
            --ps5sdk $PS5SDK_DIR \
            --work-dir build/pkg

      - name: Upload PS5 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-ps5-homebrew-binary
          path: target/x86_64-unknown-freebsd/release/discord-app
          retention-days: 30

      - name: Upload PS5 Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-ps5-homebrew-pkg
          path: discord-ps5.pkg
          retention-days: 30

      - name: Create release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-freebsd/release/discord-app
            discord-ps5.pkg
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Discord PS5 Homebrew ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Native Linux build for testing
  build-native:
    name: Native Linux Build (Testing)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libdrm-dev \
            clang \
            llvm

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-

      - name: Build native (for testing)
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu

      - name: Run tests
        run: cargo test --workspace