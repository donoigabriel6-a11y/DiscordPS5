name: Build Discord PS5 (Homebrew)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Homebrew PS5SDK version/release to use
  PS5SDK_VERSION: "main"
  PS5SDK_REPO: "PS5Dev/PS5SDK"

jobs:
  build:
    name: Build for PS5 (x86_64-unknown-freebsd) with Homebrew PS5SDK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            cmake \
            ninja-build \
            git \
            wget \
            unzip \
            python3 \
            python3-pip \
            libssl-dev \
            pkg-config \
            libxcb1-dev \
            perl

      - name: Install Python dependencies for packaging
        run: |
          pip3 install pillow

      - name: Install Homebrew PS5SDK from source
        id: ps5sdk
        run: |
          echo "=== Installing PS5SDK from source ==="

          SDK_DIR="/opt/ps5sdk"
          echo "PS5SDK_DIR=$SDK_DIR" >> $GITHUB_ENV

          # Clone PS5SDK
          git clone --depth 1 --branch "${{ env.PS5SDK_VERSION }}" \
            "https://github.com/${{ env.PS5SDK_REPO }}.git" /tmp/PS5SDK
          cd /tmp/PS5SDK

          # Patch CMakeLists.txt to disable building examples (they have compilation errors)
          sed -i '/add_subdirectory("examples\//d' CMakeLists.txt

          # Build PS5SDK using cmake directly
          mkdir -p build
          cd build
          cmake -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/PS5SDK/cmake/toolchain-ps5.cmake \
            /tmp/PS5SDK
          ninja

          # Install to target directory manually (PS5SDK CMakeLists.txt has no install() commands)
          sudo mkdir -p "$SDK_DIR/bin" "$SDK_DIR/lib" "$SDK_DIR/include"

          # Copy compiler wrapper scripts
          sudo cp /tmp/PS5SDK/cmake/ps5-clang "$SDK_DIR/bin/" 2>/dev/null || true
          sudo cp /tmp/PS5SDK/cmake/ps5-clang++ "$SDK_DIR/bin/" 2>/dev/null || true
          sudo cp /tmp/PS5SDK/cmake/ps5-ar "$SDK_DIR/bin/" 2>/dev/null || true
          sudo cp /tmp/PS5SDK/cmake/ps5-ranlib "$SDK_DIR/bin/" 2>/dev/null || true
          sudo cp /tmp/PS5SDK/cmake/ps5-ld "$SDK_DIR/bin/" 2>/dev/null || true

          # Copy built libraries
          sudo cp /tmp/PS5SDK/build/lib/*.a "$SDK_DIR/lib/" 2>/dev/null || true

          # Copy headers
          sudo cp -r /tmp/PS5SDK/include/* "$SDK_DIR/include/" 2>/dev/null || true
          sudo cp -r /tmp/PS5SDK/ps5 "$SDK_DIR/include/" 2>/dev/null || true

          # Verify SDK installation
          echo "=== PS5SDK Installation ==="
          ls -la "$SDK_DIR/"

          # Check for ps5-clang
          if [ -f "$SDK_DIR/bin/ps5-clang" ]; then
            echo "PS5SDK installed successfully (ps5-clang found)"
            "$SDK_DIR/bin/ps5-clang" --version
          else
            echo "ERROR: PS5SDK compiler not found at $SDK_DIR/bin/ps5-clang"
            echo "SDK directory contents:"
            find "$SDK_DIR" -type f | head -30
            exit 1
          fi

      - name: Configure cargo for PS5 target
        run: |
          mkdir -p ~/.cargo

          cat > ~/.cargo/config.toml << EOF
          [target.x86_64-unknown-freebsd]
          linker = "ps5-clang"
          ar = "ps5-ar"

          [env]
          PS5_SDK_PATH = "${{ env.PS5SDK_DIR }}"
          # Use shell \$PATH to preserve system paths (cargo, rustc, etc.)
          PATH = "${{ env.PS5SDK_DIR }}/bin:\${PATH}"
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER = "ps5-clang"
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_AR = "ps5-ar"
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_RUNNER = "ps5-run"
          EOF

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ps5-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ps5-

      - name: Build workspace (check only)
        run: cargo check --workspace --target x86_64-unknown-freebsd --no-default-features --features ps5-platform/ps5,discord-ui/ps5
        env:
          PS5_SDK_PATH: ${{ env.PS5SDK_DIR }}
          CC_x86_64_unknown_freebsd: ps5-clang
          AR_x86_64_unknown_freebsd: ps5-ar
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER: ps5-clang
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_AR: ps5-ar

      - name: Build release binary
        run: cargo build --release --workspace --target x86_64-unknown-freebsd --no-default-features --features ps5-platform/ps5,discord-ui/ps5 --bin discord-app
        env:
          PS5_SDK_PATH: ${{ env.PS5SDK_DIR }}
          CC_x86_64_unknown_freebsd: ps5-clang
          AR_x86_64_unknown_freebsd: ps5-ar
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER: ps5-clang
          CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_AR: ps5-ar

      - name: Verify binary
        run: |
          file target/x86_64-unknown-freebsd/release/discord-app
          ls -lh target/x86_64-unknown-freebsd/release/discord-app

          # Check if it's a valid FreeBSD/PS5 binary
          if command -v readelf >/dev/null; then
            readelf -h target/x86_64-unknown-freebsd/release/discord-app | head -20
          fi

      - name: Build PS5 Package (.pkg)
        run: |
          python3 packaging/build_pkg.py \
            target/x86_64-unknown-freebsd/release/discord-app \
            -o discord-ps5.pkg \
            --title-id DISCORDPS5 \
            --title "Discord PS5" \
            --version ${{ github.ref_name == 'refs/heads/main' && '0.1.0-dev' || github.ref_name }} \
            --app-ver 01.00 \
            --content-id DISCORDPS5_001 \
            --ps5sdk ${{ env.PS5SDK_DIR }} \
            --work-dir build/pkg
        env:
          PS5_SDK_PATH: ${{ env.PS5SDK_DIR }}

      - name: Upload PS5 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-ps5-homebrew-binary
          path: target/x86_64-unknown-freebsd/release/discord-app
          retention-days: 30

      - name: Upload PS5 Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-ps5-homebrew-pkg
          path: discord-ps5.pkg
          retention-days: 30

      - name: Create release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-freebsd/release/discord-app
            discord-ps5.pkg
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Discord PS5 Homebrew ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Native Linux build for testing
  build-native:
    name: Native Linux Build (Testing)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libdrm-dev \
            clang \
            llvm

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-

      - name: Build native (for testing)
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu

      - name: Run tests
        run: cargo test --workspace