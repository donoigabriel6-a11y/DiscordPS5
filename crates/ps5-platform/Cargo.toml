[package]
name = "ps5-platform"
version = "0.1.0"
edition = "2021"

[dependencies]
discord-common = { path = "../common" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
libc = { workspace = true }

# Linux-specific dependencies (for development/testing on Linux)
drm = { version = "0.1", optional = true }
gbm = { version = "0.1", optional = true }
egl = { version = "0.2", optional = true }
gl = { version = "0.14", optional = true }
cpal = { version = "0.15", optional = true, features = ["jack"] }
rubato = { version = "0.13", optional = true }
nix = { version = "0.28", features = ["net", "process"], optional = true }
num_cpus = { version = "1.16", optional = true }
socket2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }

[features]
default = []  # No default features - must be explicitly chosen
linux-graphics = ["drm", "gbm", "egl", "gl"]
linux-audio = ["cpal", "rubato"]
linux-input = ["nix", "num_cpus"]
linux-network = ["socket2", "rand"]

# PS5 target - uses native PS5SDK APIs (stubs for now)
ps5 = []

[build-dependencies]
bindgen = "0.69"