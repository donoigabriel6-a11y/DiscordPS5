[package]
name = "discord-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
discord-common = { path = "../common" }
discord-gateway = { path = "../discord-gateway" }
discord-rest = { path = "../discord-rest" }
discord-voice = { path = "../discord-voice" }
ps5-platform = { path = "../ps5-platform" }

tokio = { workspace = true }
imgui = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

# Linux-specific OpenGL rendering
imgui-opengl-renderer = { version = "0.12", optional = true }
gl = { version = "0.14", optional = true }
glow = { version = "0.14", optional = true }

[features]
default = ["linux-renderer"]
linux-renderer = ["imgui-opengl-renderer", "gl", "glow"]
# PS5 target - uses native LibGNM renderer (stub for now)
ps5 = []